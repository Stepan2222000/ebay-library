[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-library"
version = "0.1.0"
description = "eBay parsing worker library — item (ebaydesc, без браузера) + каталог (SRP) лейны, Mode 1"
requires-python = ">=3.11"
dependencies = [
    "asyncpg",
    "beautifulsoup4",
    "boto3",
    "curl_cffi",
    "httpx",
    "lxml",
]

[project.optional-dependencies]
# браузер нужен только каталог-лейну (страницы отдаёт get_page); item-лейну — нет
catalog = ["cloakbrowser"]

[tool.setuptools.packages.find]
include = ["ebay_library*"]
